<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Why Type</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>:root{--wt-bg:#ffffff;--wt-fg:#222222;--wt-accent:#4472c4;--wt-subtle:#f5f5f5;--wt-border:#e6e6e6}*{box-sizing:border-box}body,html{height:100%;margin:0;background:var(--wt-bg);color:var(--wt-fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{-webkit-appearance:none;appearance:none;outline:0}.wt-root{display:grid;grid-template-rows:auto 1fr auto;gap:8px;height:100%;padding:10px;overflow:hidden}.wt-bar{display:flex;gap:8px;align-items:center;min-width:0}.wt-btn,.wt-input{border:1px solid var(--wt-border);background:var(--wt-subtle);color:var(--wt-fg);padding:8px;border-radius:6px;font:inherit}.wt-input{width:100%}.wt-btn{background:var(--wt-accent);color:#fff;border-color:var(--wt-accent);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:filter .08s ease-in-out,box-shadow .08s ease-in-out}.wt-btn:hover{filter:brightness(.97)}.wt-btn:active{filter:brightness(.94)}.wt-btn:focus,.wt-btn:focus-visible{box-shadow:0 0 0 2px rgba(0,0,0,.05)}.wt-btn:disabled{opacity:.6;cursor:default}.wt-cats{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;padding-right:2px}.wt-acc{border:1px solid var(--wt-border);border-radius:8px;background:var(--wt-bg)}.wt-acc-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;background:var(--wt-subtle);border-radius:8px 8px 0 0;font-weight:600}.wt-acc-h.selected{outline:2px solid var(--wt-accent);outline-offset:-2px}.wt-acc-b{display:none}.wt-acc-b.open{display:block}.wt-item{width:100%;text-align:left;padding:6px 8px;border:0;background:0 0;border-top:1px solid var(--wt-border);cursor:pointer;display:flex;align-items:center;gap:6px}.wt-item:hover{background:rgba(0,0,0,.035)}.wt-item .title{font-weight:600}.wt-item .meta{font-size:12px;opacity:.7}.wt-status{font-size:12px;opacity:.7}</style></head><body><div class="wt-root"><div class="wt-bar"><input id="wt-search" class="wt-input" type="search" placeholder="Search…"> <button id="wt-edit" class="wt-btn" title="Open Manager (Edit)">Edit</button></div><div id="wt-cats" class="wt-cats"></div><div class="wt-bar"><div id="wt-status" class="wt-status" style="flex:1;min-width:0"></div><a href="https://ko-fi.com/toxicorca" target="_blank" rel="noopener noreferrer" title="Enjoying Why Type? Buy me a coffee!" style="font-size:12px;text-decoration:none;color:var(--wt-fg);opacity:.65;white-space:nowrap">☕ Tip</a> <button id="wt-import" class="wt-btn" type="button" title="Import Why Types from a JSON file" style="padding:4px 10px;font-size:12px">Import</button> <button id="wt-export" class="wt-btn" type="button" title="Export all Why Types to a JSON file" style="padding:4px 10px;font-size:12px">Export</button> <input id="wt-import-file" type="file" accept="application/json,.json" style="display:none"></div></div><script src="taskpane.js"></script></body></html>
