<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Why Type</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>:root{--wt-bg:#ffffff;--wt-fg:#222222;--wt-accent:#4472c4;--wt-subtle:#f5f5f5;--wt-border:#e6e6e6;color-scheme:light dark}@media (prefers-color-scheme:dark){:root{--wt-bg:#1f1f1f;--wt-fg:#e8e8e8;--wt-accent:#6ba1ff;--wt-subtle:#2a2a2a;--wt-border:#3a3a3a}}@supports (color:color-mix(in srgb,red 50%,blue)){:root{--wt-subtle:color-mix(in srgb, var(--wt-bg) 93%, var(--wt-fg) 7%);--wt-border:color-mix(in srgb, var(--wt-bg) 84%, var(--wt-fg) 16%);--wt-dim:color-mix(in srgb, var(--wt-fg) 65%, var(--wt-bg) 35%);--wt-hover:color-mix(in srgb, var(--wt-bg) 96%, var(--wt-fg) 4%)}}:root{--wt-dim:#777;--wt-hover:rgba(128,128,128,.08)}*{box-sizing:border-box}body,html{height:100%;margin:0;background:var(--wt-bg);color:var(--wt-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}button,input,textarea{-webkit-appearance:none;appearance:none;outline:0;font:inherit}.wt-view{display:grid;grid-template-rows:auto 1fr auto;gap:8px;height:100%;padding:10px;overflow:hidden}.wt-bar{display:flex;gap:6px;align-items:center;min-width:0}.wt-input{border:1px solid var(--wt-border);background:var(--wt-subtle);color:var(--wt-fg);padding:7px 8px;border-radius:6px;width:100%;min-width:0}.wt-input:focus{border-color:var(--wt-accent)}.wt-btn{border:1px solid var(--wt-border);background:var(--wt-subtle);color:var(--wt-fg);padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:background .08s ease-in-out,border-color .08s ease-in-out;flex:0 0 auto}.wt-btn:hover{border-color:var(--wt-accent)}.wt-btn:active{background:var(--wt-hover)}.wt-btn.primary{background:var(--wt-accent);border-color:var(--wt-accent);color:#fff;font-weight:600}.wt-btn.primary:hover{filter:brightness(1.06)}.wt-btn.small{padding:4px 10px;font-size:12px}.wt-btn:disabled{opacity:.6;cursor:default}.wt-cats{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;padding-right:2px}.wt-acc{border:1px solid var(--wt-border);border-radius:8px;background:var(--wt-bg);overflow:hidden}.wt-acc-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;background:var(--wt-subtle);font-weight:600;border-left:3px solid var(--wt-accent)}.wt-acc-b{display:none;max-height:240px;overflow:auto}.wt-item{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 16px;border-top:1px solid var(--wt-border);cursor:pointer}.wt-item:hover{background:var(--wt-hover)}.wt-item .title{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wt-item .wt-row-edit{border:none;background:0 0;color:var(--wt-dim);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:14px;line-height:1;flex:0 0 auto}.wt-item .wt-row-edit:hover{color:var(--wt-accent);background:var(--wt-hover)}.wt-badge{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--wt-accent);border:1px solid var(--wt-accent);border-radius:4px;padding:0 4px;line-height:1.5;opacity:.85}.wt-cat-tools{display:flex;align-items:center;gap:1px;flex:0 0 auto}.wt-cat-down,.wt-cat-up{border:none;background:0 0;color:var(--wt-dim);cursor:pointer;padding:1px 4px;border-radius:3px;font-size:10px;line-height:1.4}.wt-cat-down:hover,.wt-cat-up:hover{color:var(--wt-accent);background:var(--wt-hover)}.wt-acc-chevron{margin-left:4px}.wt-status{font-size:12px;color:var(--wt-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wt-link{font-size:12px;text-decoration:none;color:var(--wt-dim);white-space:nowrap}.wt-link:hover{color:var(--wt-accent)}#wt-editor{display:none}.wt-form{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-right:2px}.wt-form label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--wt-dim)}.wt-form label>.wt-input,.wt-form label>textarea{margin-top:4px}.wt-form textarea{border:1px solid var(--wt-border);background:var(--wt-subtle);color:var(--wt-fg);padding:8px;border-radius:6px;width:100%;min-height:120px;height:160px;resize:vertical;line-height:1.45}.wt-form textarea:focus{border-color:var(--wt-accent)}.wt-seg{display:flex;border:1px solid var(--wt-border);border-radius:6px;overflow:hidden;width:max-content}.wt-seg button{border:none;background:var(--wt-subtle);color:var(--wt-dim);padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600}.wt-seg button+button{border-left:1px solid var(--wt-border)}.wt-seg button.active{background:var(--wt-accent);color:#fff}.wt-seg button:not(.active):hover{color:var(--wt-fg)}#wt-e-preview{border:1px solid var(--wt-border);background:var(--wt-subtle);border-radius:6px;padding:8px;min-height:48px;max-height:140px;overflow:auto;word-break:break-word;line-height:1.45}.wt-editor-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body><div id="wt-list" class="wt-view"><div class="wt-bar"><input id="wt-search" class="wt-input" type="search" placeholder="Search…"> <button id="wt-new" class="wt-btn" title="Create a new Why Type">+ New</button></div><div id="wt-cats" class="wt-cats"></div><div class="wt-bar"><div id="wt-status" class="wt-status" style="flex:1;min-width:0"></div><a class="wt-link" href="https://ko-fi.com/toxicorca" target="_blank" rel="noopener noreferrer" title="Enjoying Why Type? Buy me a coffee!">☕ Tip</a> <button id="wt-expand" class="wt-btn small" title="Replace the keyword you selected in the email with its template">Expand</button> <button id="wt-import" class="wt-btn small" title="Import Why Types from a JSON file">Import</button> <button id="wt-export" class="wt-btn small" title="Export all Why Types to a JSON file">Export</button> <input id="wt-import-file" type="file" accept="application/json,.json" style="display:none"></div></div><div id="wt-editor" class="wt-view"><div class="wt-bar"><button id="wt-back" class="wt-btn" title="Back to your Why Types">←</button><div id="wt-e-name" class="wt-editor-name">Edit</div></div><div class="wt-form"><label>Title <input id="wt-e-title" class="wt-input" placeholder="ex: Meeting follow-up"></label> <label>Category <input id="wt-e-cat" class="wt-input" placeholder="ex: General"></label> <label>Keyword <span style="text-transform:none;letter-spacing:0">(for the Expand button)</span> <input id="wt-e-keyword" class="wt-input" placeholder="ex: hello"></label> <label>Body <textarea id="wt-e-body" rows="8" spellcheck="true" placeholder="Type your template here…"></textarea></label> <label>Format<div class="wt-seg" id="wt-e-format" style="margin-top:4px"><button type="button" data-fmt="text" class="active">Plain text</button> <button type="button" data-fmt="html">HTML</button></div></label> <label>Preview <span id="wt-e-prevnote" style="text-transform:none;letter-spacing:0"></span></label><div id="wt-e-preview"></div></div><div class="wt-bar"><button id="wt-e-save" class="wt-btn primary">Save</button> <button id="wt-e-insert" class="wt-btn" title="Insert this template into the email">Insert</button><div id="wt-e-status" class="wt-status" style="flex:1;min-width:0"></div><button id="wt-e-del" class="wt-btn">Delete</button></div></div><script src="taskpane.js"></script></body></html>
